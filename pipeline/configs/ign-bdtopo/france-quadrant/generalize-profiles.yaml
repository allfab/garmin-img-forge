# Profils de simplification — variante locale (départements, outre-mer).
# Seul TRONCON_DE_ROUTE diffère du catalogue partagé : seuils simplify_vw
# n=0..3 réduits ~50 % pour préserver virages et intersections au zoom élevé.

profiles:
  TRONCON_HYDROGRAPHIQUE:
    levels:
      - { n: 0 }
      - { n: 1, simplify: 0.0001 }
      - { n: 2, simplify: 0.0002 }

  ZONE_DE_VEGETATION:
    levels:
      - { n: 0 }
      - { n: 1 }
      - { n: 2, simplify: 0.00002 }
      - { n: 3, simplify: 0.00004 }
      - { n: 4, simplify: 0.00008 }
      - { n: 5, simplify: 0.00016 }
      - { n: 6, simplify: 0.00032 }

  TRONCON_DE_ROUTE:
    # topology: false — simplification par tuile (non globale).
    # Raison : topology: true avec n=0..6 × 25 départements charge des millions
    # de segments en RAM simultanément → OOM sur les scopes multi-départements.
    # Pour france-quadrant, les artefacts de jonction aux croisées de tuiles sont
    # imperceptibles à l'échelle de rendu (overview France entière).
    # Routing non impacté : le graphe routier est calculé par tuile dans process_single_tile.
    topology: false
    when:
      - field: CL_ADMIN
        values: [Autoroute]
        levels:
          - { n: 0 }
          - { n: 1 }
          - { n: 2, simplify_vw: 0.000001 }
          - { n: 3, simplify_vw: 0.000002 }
          - { n: 4, simplify_vw: 0.000010 }
          - { n: 5, simplify_vw: 0.000100 }
          - { n: 6, simplify_vw: 0.000300 }
      - field: CL_ADMIN
        values: [Nationale, "Nationale/Route nommée"]
        levels:
          - { n: 0 }
          - { n: 1 }
          - { n: 2, simplify_vw: 0.000001 }
          - { n: 3, simplify_vw: 0.000002 }
          - { n: 4, simplify_vw: 0.000010 }
          - { n: 5, simplify_vw: 0.000100 }
          - { n: 6, simplify_vw: 0.000300 }
      - field: CL_ADMIN
        values: [Départementale, "Départementale/Route nommée"]
        levels:
          - { n: 0 }
          - { n: 1 }
          - { n: 2, simplify_vw: 0.000001 }
          - { n: 3, simplify_vw: 0.000002 }
          - { n: 4, simplify_vw: 0.000010 }
          - { n: 5, simplify_vw: 0.000100 }
          - { n: 6, simplify_vw: 0.000300 }
      - field: CL_ADMIN
        values: [Communale, "Sans objet"]
        levels:
          - { n: 0 }
          - { n: 1 }
          - { n: 2, simplify_vw: 0.000001 }
          - { n: 3, simplify_vw: 0.000002 }
          - { n: 4, simplify_vw: 0.000010 }
          - { n: 5, simplify_vw: 0.000100 }
          - { n: 6, simplify_vw: 0.000300 }
      - field: CL_ADMIN
        values: [Chemin, Sentier]
        levels:
          - { n: 0 }
          - { n: 1 }
          - { n: 2, simplify_vw: 0.000001 }
          - { n: 3, simplify_vw: 0.000002 }
          - { n: 4, simplify_vw: 0.000010 }
          - { n: 5, simplify_vw: 0.000100 }
          - { n: 6, simplify_vw: 0.000300 }
    levels:
      - { n: 0 }
      - { n: 1 }
      - { n: 2, simplify_vw: 0.000001 }
      - { n: 3, simplify_vw: 0.000002 }
      - { n: 4, simplify_vw: 0.000010 }
      - { n: 5, simplify_vw: 0.000100 }
      - { n: 6, simplify_vw: 0.000300 }

  # Courbes de niveau — 2 profils calés sur leurs EndLevel respectifs (règle contiguïté n=0..EndLevel)
  COURBE_100:
    levels:
      - { n: 0 }
      - { n: 1 }

  COURBE_20:
    levels:
      - { n: 0 }

  CONSTRUCTION_LINEAIRE:
    levels:
      - { n: 0 }
      - { n: 1 }
      - { n: 2, simplify: 0.00004 }
      - { n: 3, simplify: 0.00008 }
      - { n: 4, simplify: 0.00030 }
      - { n: 5, simplify: 0.00100 }
      - { n: 6, simplify: 0.00100 }

  SURFACE_HYDROGRAPHIQUE:
    levels:
      - { n: 0}
      - { n: 1, simplify: 0.00001 }
      - { n: 2, simplify: 0.00004 }
      - { n: 3, simplify: 0.00008 }
      - { n: 4, simplify: 0.00030 }
      - { n: 5, simplify: 0.00100 }
      - { n: 6, simplify: 0.00100 }

  ZONE_D_HABITATION:
    levels:
      - { n: 0, smooth: chaikin, iterations: 1, simplify: 0.00005 }
      - { n: 1, simplify: 0.00006 }
      - { n: 2, simplify: 0.00008 }
      - { n: 3, simplify: 0.00012 }
      - { n: 4, simplify: 0.00030 }
      - { n: 5, simplify: 0.00100 }
      - { n: 6, simplify: 0.00100 }

  TRONCON_DE_VOIE_FERREE:
    # EndLevel=4 pour tous les types (LGV, principale, service, tramway…).
    # Paliers n=0..4 uniquement — imgforge ne rend pas au-delà de EndLevel.
    levels:
      - { n: 0 }
      - { n: 1, simplify: 0.00001 }
      - { n: 2, simplify: 0.00005 }
      - { n: 3, simplify: 0.00010 }
      - { n: 4, simplify: 0.00020 }

  COMMUNE:
    # topology: true — frontières partagées entre communes (même shapefile BDTOPO).
    # n=4..6 sans simplify_vw : le rounding shift=4/6/8 élimine les points
    # redondants nativement. Appliquer VW avant rounding effondre les petites
    # communes (< 0.01°) à ≤3 points identiques → polygone supprimé silencieusement
    # → aplats ZONE_DE_VEGETATION visibles. Confirmé : 7/61 communes perdues sans
    # cette protection, 0/61 avec.
    topology: true
    levels:
      - { n: 0 }
      - { n: 1 }
      - { n: 2, simplify_vw: 0.00013 }
      - { n: 3, simplify_vw: 0.00020 }
      - { n: 4 }
      - { n: 5 }
      - { n: 6 }

  DEPARTEMENT_LIMITE:
    topology: true
    levels:
      - { n: 0 }
      - { n: 1 }
      - { n: 2 }
      - { n: 3, simplify_vw: 0.00001 }
      - { n: 4, simplify_vw: 0.00003 }
      - { n: 5, simplify_vw: 0.00005 }
      - { n: 6, simplify_vw: 0.00007 }

  # Fond de mer (POLYGON 0x32) — départements côtiers (ex : Corse).
  # Polygone littoral d'un seul tenant : sans simplification dès n=0, un seul
  # shape atteint ~45 000 points (~183 KB) > MAX_RGN_SIZE, gonfle le RGN et fait
  # déborder la FAT IMG (Block overflow > 65534 blocs). imgforge ne sait pas
  # scinder un shape unique → on dégrossit ici. C'est un aplat d'arrière-plan :
  # le trait de côte visible reste porté par LIMITE_TERRE_MER (0x15).
  SEA:
    levels:
      - { n: 0, simplify: 0.0001 }
      - { n: 1, simplify: 0.0002 }
      - { n: 2, simplify: 0.0004 }
      - { n: 3, simplify: 0.0008 }
      - { n: 4, simplify: 0.0010 }
      - { n: 5, simplify: 0.0010 }
      - { n: 6, simplify: 0.0010 }

  # Trait de côte (POLYLINE 0x15 / 0x10e1b) — EndLevel max 4, paliers n=0..4.
  # Lignes clippées géographiquement (pas de débordement single-shape), mais
  # 17 498 features à pleine résolution alourdissent le RGN : simplification
  # douce pour préserver le rendu de la côte au zoom élevé.
  LIMITE_TERRE_MER:
    levels:
      - { n: 0 }
      - { n: 1 }
      - { n: 2, simplify: 0.00008 }
      - { n: 3, simplify: 0.00016 }
      - { n: 4, simplify: 0.00032 }

  OCCUPATION_DU_SOL:
    topology: false
    levels:
      - { n: 0 }
      - { n: 1, simplify: 0.00001 }
      - { n: 2, simplify: 0.00005 }
      - { n: 3, simplify: 0.00010 }
      - { n: 4, simplify: 0.00020 }
